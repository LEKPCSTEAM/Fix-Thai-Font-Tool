[project]
name = "lvgl-thai-font-tool"
version = "0.1.0"
description = "Fix Thai mark positions in TTF and convert to LVGL .c font"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.62.1",
    "hatchling>=1.29.0",
    "numpy>=2.4.4",
]

[project.scripts]
fix-thai   = "lvgl_thai_font_tool.fix:main"
to-lvgl    = "lvgl_thai_font_tool.convert:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lvgl_thai_font_tool"]
